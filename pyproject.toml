[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eyetable"
version = "0.1.0"
description = "Capture data from any source into storage you own, then analyze it on your terms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
eyetable = "eyetable.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eyetable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
